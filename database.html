<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Database - ZeroWasteKitchen</title>
<meta name="description" content="Browse and filter 55+ plastic-free kitchen products by category, material, price, and durability.">
<meta property="og:title" content="Product Database - ZeroWasteKitchen">
<meta property="og:description" content="Filter and compare plastic-free kitchen products. Glass, bamboo, stainless steel, beeswax and more.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://humancronadmin.github.io/zero-waste-kitchen/database.html">
<link rel="canonical" href="https://humancronadmin.github.io/zero-waste-kitchen/database.html">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="nav">
  <a href="index.html" class="nav-brand">ZeroWaste<span>Kitchen</span></a>
  <div class="nav-links">
    <a href="database.html" class="active">Database</a>
    <a href="index.html#guides">Guides</a>
    <a href="index.html#about">About</a>
  </div>
</nav>

<div class="db-header">
  <h1>Product Database</h1>
  <p>Every plastic-free swap, compared and verified.</p>
</div>

<div class="filters">
  <select id="filter-category" aria-label="Filter by category">
    <option value="">All Categories</option>
    <option value="food-storage">Food Storage</option>
    <option value="wrap-alternative">Wrap Alternatives</option>
    <option value="cleaning">Cleaning</option>
    <option value="utensils">Utensils</option>
    <option value="drinkware">Drinkware</option>
    <option value="bags">Bags</option>
    <option value="cooking">Cooking</option>
    <option value="other">Other</option>
  </select>
  <select id="filter-material" aria-label="Filter by material">
    <option value="">All Materials</option>
    <option value="glass">Glass</option>
    <option value="stainless-steel">Stainless Steel</option>
    <option value="silicone">Silicone</option>
    <option value="bamboo">Bamboo</option>
    <option value="beeswax">Beeswax</option>
    <option value="cotton">Cotton</option>
    <option value="other">Other</option>
  </select>
  <input type="search" id="filter-search" placeholder="Search products..." aria-label="Search products">
  <select id="filter-sort" aria-label="Sort by">
    <option value="name">Sort: Name A-Z</option>
    <option value="price-asc">Sort: Price Low-High</option>
    <option value="price-desc">Sort: Price High-Low</option>
    <option value="durability">Sort: Durability</option>
  </select>
</div>

<div class="product-count" id="product-count"></div>
<div class="product-grid" id="product-grid"></div>

<footer class="footer">
  <p>ZeroWasteKitchen is an open-source project by
    <a href="https://github.com/humancronadmin" target="_blank" rel="noopener">humancronadmin</a>.
  </p>
</footer>

<script src="js/database.js"></script>
</body>
</html>
